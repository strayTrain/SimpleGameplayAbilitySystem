[/Script/GameplayTags.GameplayTagsList]

; Attribute Modifier event tags (SimpleEvent system)
GameplayTagList=(Tag="SimpleGAS.Events.AttributeModifier.Applied", DevComment="Event sent when a modifier is initially applied to an attribute component")
GameplayTagList=(Tag="SimpleGAS.Events.AttributeModifier.Ticked", DevComment="Event sent when a duration modifier ticks")
GameplayTagList=(Tag="SimpleGAS.Events.AttributeModifier.TickFailedSkip", DevComment="Event sent when a duration modifier fails to tick and has TickTagRequirementBehaviour == SkipOnTagRequirementFailed")
GameplayTagList=(Tag="SimpleGAS.Events.AttributeModifier.TickFailedCancel", DevComment="Event sent when a duration modifier fails to tick and has TickTagRequirementBehaviour == CancelOnTagRequirementFailed")
GameplayTagList=(Tag="SimpleGAS.Events.AttributeModifier.Ended", DevComment="Event sent when a duration modifier ends successfully")
GameplayTagList=(Tag="SimpleGAS.Events.AttributeModifier.Cancelled", DevComment="Event sent when a duration modifier is cancelled prematurely")

; Stacking event tags
GameplayTagList=(Tag="SimpleGAS.Events.AttributeModifier.StackChanged", DevComment="Event sent when a modifier's stack count changes")
GameplayTagList=(Tag="SimpleGAS.Events.AttributeModifier.StackAdded", DevComment="Event sent when a stack is added to a modifier")
GameplayTagList=(Tag="SimpleGAS.Events.AttributeModifier.StackRemoved", DevComment="Event sent when a stack is removed from a modifier")
GameplayTagList=(Tag="SimpleGAS.Events.AttributeModifier.PredictionCorrected", DevComment="Event sent when client prediction is corrected by server")

; Domain tags for event categorization
GameplayTagList=(Tag="SimpleGAS.Domains.AttributeModifier", DevComment="Domain tag for attribute modifier events")
GameplayTagList=(Tag="SimpleGAS.Domains.Ability", DevComment="Domain tag for ability events")

; Attribute Modifier Action scratchpad tags
GameplayTagList=(Tag="SimpleGAS.ModifierActionScratchpadTags.FloatAttributeOverflow", DevComment="A scratchpad entry used to keep track of float attribute overflow")
GameplayTagList=(Tag="SimpleGAS.ModifierActionScratchpadTags.RuntimeActionExecutionResult", DevComment="A scratchpad entry storing FRuntimeActionExecutionResult for prediction correction")

; Stacking scratchpad tags
GameplayTagList=(Tag="SimpleGAS.ScratchPad.StackCount", DevComment="Scratchpad tag for current stack count, auto-injected when stacking is enabled")
GameplayTagList=(Tag="SimpleGAS.ScratchPad.ScaledMagnitude", DevComment="Scratchpad tag for scaled magnitude based on stack count, auto-injected when stacking is enabled")

; Sub Abilty events
GameplayTagList=(Tag="SimpleGAS.Events.SubAbility.Ended", DevComment="Used by the WaitForClientSubAbility async action to signal that a sub ability has ended")
GameplayTagList=(Tag="SimpleGAS.Events.SubAbility.Cancelled", DevComment="Used by the WaitForClientSubAbility async action to signal that a sub ability has been cancelled")